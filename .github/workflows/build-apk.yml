name: Build test APK

# Manual only (Actions tab → "Build test APK" → Run workflow), so pushes don't
# spend build minutes. Produces a release APK for testing on phones, signed with
# the upload key from repository secrets when present (so each new build updates
# the installed app instead of needing a reinstall); it is not a Play Store build.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL (leave blank for the app default — the live server)"
        required: false
        default: ""

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write signing config (if secrets are set)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No signing secrets — debug-signed build"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (arm64)
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            flutter build apk --release --target-platform android-arm64 --dart-define=API_BASE_URL="$API_BASE_URL"
          else
            flutter build apk --release --target-platform android-arm64
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gatepass-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
