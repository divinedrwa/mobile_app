name: Build test APK

# Manual only (Actions tab → "Build test APK" → Run workflow), so pushes don't
# spend build minutes. Produces a debug-signed release APK for testing on phones;
# it is not a Play Store build.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL (leave blank for the app default — the live server)"
        required: false
        default: ""

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (arm64)
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            flutter build apk --release --target-platform android-arm64 --dart-define=API_BASE_URL="$API_BASE_URL"
          else
            flutter build apk --release --target-platform android-arm64
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gatepass-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
